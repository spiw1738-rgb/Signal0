name: Live Bot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a 'bot is on' message in Telegram? (true/false)"
        default: "true"
        required: false

permissions:
  contents: write

concurrency:
  group: live-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run live bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event.inputs.send_test }}
          MAX_MINUTES: "345"
        run: python live_bot.py
